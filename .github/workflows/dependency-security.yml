name: Scheduled dependency security audit

on:
  schedule:
    - cron: '23 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The local security controls must be tested through installed build tools.
      # Keep lifecycle scripts disabled and use no deployment secrets.
      - name: Install locked dependencies for security controls
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit runtime and development dependencies
        timeout-minutes: 3
        run: pnpm security:audit
